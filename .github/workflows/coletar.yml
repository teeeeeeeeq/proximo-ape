name: Coletar anúncios

on:
  schedule:
    # de hora em hora: o GitHub pula muitos horários agendados, então tenta a cada 10 min e o job "relogio" só deixa buscar
    # quando a última busca (o último estado na branch dados) foi há 50 min ou mais; as outras tentativas param em segundos
    - cron: '*/10 * * * *'
  workflow_dispatch:   # e quando pedido (botão "Buscar agora" no app ou Actions → Run workflow)
    inputs:
      somente:
        description: 'Só estas fontes (ex.: facebook, olx). Vazio = todas; "nenhuma" = só publicar (vereditos novos do Claude e o aviso)'
        required: false
        default: ''
      abrir:
        description: 'Link de um anúncio do Facebook para conferir (se ainda está no ar e a descrição), ou uma palavra para procurar nas descrições do Marketplace (ex.: sicredi); não busca nos sites'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # avisos (apartamento novo, favorito que baixou): uma issue que menciona o dono (o GitHub manda por e-mail)

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rodar: ${{ steps.r.outputs.rodar }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo "rodar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          ultima=$(gh api "repos/${{ github.repository }}/commits/dados" --jq .commit.committer.date 2>/dev/null || echo 1970-01-01T00:00:00Z)
          min=$(( ($(date +%s) - $(date -d "$ultima" +%s)) / 60 ))
          echo "última busca há $min min"
          if [ "$min" -ge 50 ]; then echo "rodar=true" >> "$GITHUB_OUTPUT"; else echo "rodar=false" >> "$GITHUB_OUTPUT"; fi

  coletar:
    needs: relogio
    if: needs.relogio.outputs.rodar == 'true'
    concurrency:   # no job (não no workflow): as tentativas do relógio que não buscam não entram na fila nem tiram a vez de ninguém
      group: coletar
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar o histórico (branch dados)
        run: |
          git clone --depth 1 --branch dados "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/estado || true
          mkdir -p dados
          cp /tmp/estado/*.json dados/ 2>/dev/null || true
          # vereditos que a rotina do Claude (pelo plano do dono) gravou sobre as fotos da fila
          git clone --depth 1 --branch avaliacoes "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/avaliacoes \
            && cp /tmp/avaliacoes/avaliacoes.json dados/avaliacoes_rotina.json || true
          # e os endereços que ela pesquisou para anúncios sem endereço
          cp /tmp/avaliacoes/enderecos.json dados/enderecos_rotina.json 2>/dev/null || true
          ls -la dados

      - name: Favoritos para o aviso de preço (a issue mais recente que o app abriu com a lista)
        continue-on-error: true   # se falhar, vale a lista da rodada anterior (dados/favoritos_issue.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues?creator=${{ github.repository_owner }}&state=all&sort=created&direction=desc&per_page=50" \
            --jq '[.[] | select(.pull_request == null and (.title | startswith("Favoritos para o aviso")))][0] // empty | {numero: .number, quando: .created_at, texto: .body}' > /tmp/favoritos.json
          if [ -s /tmp/favoritos.json ]; then mv /tmp/favoritos.json dados/favoritos_issue.json; else echo "nenhuma lista de favoritos"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install websocket-client anthropic pillow

      - name: Buscar anúncios
        env:
          TZ: America/Sao_Paulo
          SOMENTE: ${{ inputs.somente }}
          ABRIR: ${{ inputs.abrir }}
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}   # sessão do Facebook (Settings → Secrets → Actions); vazio = sem login
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # o Claude confere as fotos; vazio = ninguém confere (e não sai aviso)
        run: python coletor/coletar.py

      - name: Fila de fotos para a rotina do Claude
        continue-on-error: true   # sem a chave da API, a rotina do Claude Code confere as fotos daqui (coletor/rotina.py)
        run: |
          if [ -f fila/fila.json ]; then
            cd fila
            git init -q -b fila-claude
            git config user.name "coletor"
            git config user.email "coletor@users.noreply.github.com"
            git add -A
            git commit -qm "fila $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fila-claude
            du -sh .
          else
            echo "sem fila nesta rodada"
          fi

      - name: Avisar apartamento de acabamento excelente (e-mail pelo GitHub)
        continue-on-error: true   # se falhar, a busca segue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f dados/alerta.md ]; then
            gh issue create --repo "${{ github.repository }}" --title "$(cat dados/alerta_titulo.txt)" --body-file dados/alerta.md
            rm -f dados/alerta.md dados/alerta_titulo.txt
          else
            echo "nada novo de acabamento excelente"
          fi

      - name: Avisar favorito que baixou de preço (e-mail pelo GitHub)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f dados/alerta_preco.md ]; then
            gh issue create --repo "${{ github.repository }}" --title "$(cat dados/alerta_preco_titulo.txt)" --body-file dados/alerta_preco.md
            rm -f dados/alerta_preco.md dados/alerta_preco_titulo.txt
          else
            echo "nenhum favorito baixou"
          fi

      - name: Guardar o histórico
        run: |
          cd dados
          git init -q -b dados
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add *.json
          git commit -qm "estado $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
