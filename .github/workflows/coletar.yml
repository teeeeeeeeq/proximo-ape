name: Coletar anúncios

on:
  schedule:
    - cron: '17 * * * *'   # a cada hora (o GitHub às vezes atrasa alguns minutos); só a faixa do perfil, uns 5 min
  workflow_dispatch:   # e quando pedido (botão "Buscar agora" no app ou Actions → Run workflow)
    inputs:
      somente:
        description: 'Só estas fontes (ex.: facebook, olx). Vazio = todas; "nenhuma" = só publicar (vereditos novos do Claude e o aviso)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # aviso de apartamento novo: uma issue que menciona o dono (o GitHub manda por e-mail)

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar o histórico (branch dados)
        run: |
          git clone --depth 1 --branch dados "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/estado || true
          mkdir -p dados
          cp /tmp/estado/*.json dados/ 2>/dev/null || true
          # vereditos que a rotina do Claude (pelo plano do dono) gravou sobre as fotos da fila
          git clone --depth 1 --branch avaliacoes "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/avaliacoes \
            && cp /tmp/avaliacoes/avaliacoes.json dados/avaliacoes_rotina.json || true
          ls -la dados

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install websocket-client anthropic pillow

      - name: Buscar anúncios
        env:
          TZ: America/Sao_Paulo
          SOMENTE: ${{ inputs.somente }}
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}   # sessão do Facebook (Settings → Secrets → Actions); vazio = sem login
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # o Claude confere as fotos; vazio = ninguém confere (e não sai aviso)
        run: python coletor/coletar.py

      - name: Fila de fotos para a rotina do Claude
        continue-on-error: true   # sem a chave da API, a rotina do Claude Code confere as fotos daqui (coletor/rotina.py)
        run: |
          if [ -f fila/fila.json ]; then
            cd fila
            git init -q -b fila-claude
            git config user.name "coletor"
            git config user.email "coletor@users.noreply.github.com"
            git add -A
            git commit -qm "fila $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fila-claude
            du -sh .
          else
            echo "sem fila nesta rodada"
          fi

      - name: Avisar apartamento como o do Piatã (e-mail pelo GitHub)
        continue-on-error: true   # se falhar, a busca segue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f dados/alerta.md ]; then
            gh issue create --repo "${{ github.repository }}" --title "$(cat dados/alerta_titulo.txt)" --body-file dados/alerta.md
            rm -f dados/alerta.md dados/alerta_titulo.txt
          else
            echo "nada novo como o do Piatã"
          fi

      - name: Guardar o histórico
        run: |
          cd dados
          git init -q -b dados
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add *.json
          git commit -qm "estado $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
