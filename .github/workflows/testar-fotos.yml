name: Testar fotos

on:
  workflow_dispatch:   # Actions → Testar fotos → Run workflow: o Claude confere os anúncios mais recentes e mostra o que viu
    inputs:
      quantos:
        description: 'Quantos anúncios conferir'
        required: false
        default: '10'

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar o histórico (branch dados)
        run: |
          git clone --depth 1 --branch dados "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/estado
          mkdir -p dados
          cp /tmp/estado/*.json dados/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install websocket-client anthropic pillow

      - name: O Claude confere as fotos
        env:
          TZ: America/Sao_Paulo
          QUANTOS: ${{ inputs.quantos }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python coletor/teste_fotos.py
